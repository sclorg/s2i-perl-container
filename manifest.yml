# Manifest for image directories creation
# every dest path will be prefixed by $DESTDIR/$version

# Files containing distgen directives
DISTGEN_RULES:
  - src: src/README.md
    dest: README.md


# Files containing distgen directives, which are used for each
# (distro, version) combination not excluded in multispec
DISTGEN_MULTI_RULES:
  - src: src/Dockerfile
    dest: Dockerfile.rhel8

  - src: src/Dockerfile
    dest: Dockerfile.rhel9

  - src: src/Dockerfile
    dest: Dockerfile.rhel10

  - src: src/Dockerfile
    dest: Dockerfile.c9s

  - src: src/Dockerfile
    dest: Dockerfile.c10s

  - src: src/Dockerfile.fedora
    dest: Dockerfile.fedora


# Files to copy
COPY_RULES:
  - src: src/s2i/bin/assemble
    dest: s2i/bin/assemble
    mode: "0755"

  - src: src/s2i/bin/run
    dest: s2i/bin/run
    mode: "0755"

  - src: src/s2i/bin/usage
    dest: s2i/bin/usage
    mode: "0755"

  - src: src/root/opt/app-root/Plack-1.0047-Work-around-mod_fcgid-bogus-SCRIPT_NAME-PATH_INFO.patch
    dest: root/opt/app-root/Plack-1.0047-Work-around-mod_fcgid-bogus-SCRIPT_NAME-PATH_INFO.patch

  - src: src/root/opt/app-root/psgiwrapper
    dest: root/opt/app-root/psgiwrapper
    mode: "0755"

  - src: src/root/opt/app-root/etc/httpd.conf
    dest: root/opt/app-root/etc/httpd.conf

  - src: src/root/opt/app-root/etc/httpdconf-fed.sed
    dest: root/opt/app-root/etc/httpdconf-fed.sed

  - src: src/root/opt/app-root/etc/httpdconf.sed
    dest: root/opt/app-root/etc/httpdconf.sed

  - src: src/root/opt/app-root/etc/httpdconf-fed.sed
    dest: root/opt/app-root/etc/httpdconf-fed.sed

  - src: src/root/opt/app-root/etc/httpd.d/50-mpm.conf.template
    dest: root/opt/app-root/etc/httpd.d/50-mpm.conf.template



# Symbolic links
# This section is the last one on purpose because the generator.py
# does not allow dead symlinks.
SYMLINK_RULES:
  - src: ../test
    dest: test
